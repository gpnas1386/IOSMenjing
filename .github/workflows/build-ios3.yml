name: Build IPA v3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 修复工程与源码
        run: |
          set -e
          python3 -c "p='OutingTracker.xcodeproj/project.pbxproj';s=open(p).read();i=s.index('K01000002000000000000002 /* Sources */ = {');j=s.index('/* End PBXSourcesBuildPhase',i);seg=s[i:j];print('widget sources: already ok' if 'OutingStore.swift in Sources' in seg else 'widget sources: patching');k=seg.index('files = (')+9;open(p,'w').write(s if 'OutingStore.swift in Sources' in seg else s[:i]+seg[:k]+'\n\t\t\t\tA0100000A00000000000000A /* OutingStore.swift in Sources */,'+seg[k:]+s[j:])"
          sed -i '' 's/^enum WidgetStore {/struct WidgetStore {/' Widget/OutingWidget.swift
          grep -q 'struct WidgetStore {' Widget/OutingWidget.swift
          if ! grep -q 'enum Theme' Widget/OutingWidget.swift; then
            printf '\n// MARK: - 主题色（小组件侧副本）\n\nenum Theme {\n    static let accent = Color(red: 0.13, green: 0.45, blue: 0.98)\n    static let outing = Color(red: 1.00, green: 0.58, blue: 0.12)\n    static let overtime = Color(red: 0.92, green: 0.26, blue: 0.24)\n    static let ok = Color(red: 0.16, green: 0.68, blue: 0.42)\n}\n' >> Widget/OutingWidget.swift
          fi
          echo "--- 校验 ---"
          grep -n 'struct WidgetStore {' Widget/OutingWidget.swift
          grep -n 'enum Theme' Widget/OutingWidget.swift

      - name: 工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 archive（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project OutingTracker.xcodeproj \
            -scheme OutingTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OutingTracker.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log"
          test ${PIPESTATUS[0]} -eq 0 || (echo "::error::xcodebuild failed"; grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/build.log" | head -40; exit 1)

      - name: 组装 IPA + 嵌入 entitlements
        run: |
          set -e
          APP="$RUNNER_TEMP/OutingTracker.xcarchive/Products/Applications/OutingTracker.app"
          test -d "$APP" || (echo "::error::未找到 .app"; find "$RUNNER_TEMP" -name "*.app" -maxdepth 6; exit 1)
          echo "--- 内容 ---"; ls -1 "$APP"; ls -1 "$APP/PlugIns" 2>/dev/null || echo "(无 PlugIns)"
          brew install ldid
          ldid -SApp/OutingTracker.entitlements "$APP/OutingTracker"
          if [ -d "$APP/PlugIns/OutingWidgetExtension.appex" ]; then
            ldid -SWidget/OutingTracker.entitlements "$APP/PlugIns/OutingWidgetExtension.appex/OutingWidgetExtension"
          fi
          echo "--- 签名后 entitlements ---"
          ldid -e "$APP/OutingTracker" | head -20
          rm -rf "$RUNNER_TEMP/Payload" && mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry OutingTracker.ipa Payload
          ls -lh OutingTracker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OutingTracker-ipa
          path: ${{ runner.temp }}/OutingTracker.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-v3
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
